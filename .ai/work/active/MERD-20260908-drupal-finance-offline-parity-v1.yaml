scope:
  - Reuse canonical browser queue key merdpos_financial_queue_v1.
  - Generate UUIDv4 submission IDs in the browser before first send and preserve them across retries.
  - Queue Open Day, Cash IN, Cash OUT and Z Report locally before network submission.
  - Include queued entries in effective Register/Petty Cash balances and same-day duplicate/closing guards.
  - Flush pending submissions in order when connectivity returns through a Drupal CSRF-protected JSON bridge.
