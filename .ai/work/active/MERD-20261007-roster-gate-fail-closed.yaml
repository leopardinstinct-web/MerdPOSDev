      code_assessment: 'The code would ship; the record could not ship as written.'
      transport: web (KIMI_WEB browser route)
      evidence: C:\DSH\evidence\20261007-121823-kimi-review-38b7a88-1858ae4.md
    - sha: 46545797be235657e6372104759298f6ef594c6e
      range: 1858ae4..4654579
      verdict: FIX-FIRST
      major_findings:
        - 'The pass-3 record embedded "FIXED in 4th SHA" dispositions inside the 1858ae4 record, repeating the custody violation it was written to fix. About the RECORD, not the code.'
      findings_open_at_this_sha:
        - 'MINOR: the comment model did not match shell semantics - a comment ending in a backslash continues, so a commented-out rsync was treated as live.'
        - 'MINOR: created_at was local time mislabelled Z, so as written it came AFTER updated_at and the packet read as updated before it was created.'
        - 'NIT: trim() before the backslash parity count misclassifies a backslash followed by a trailing space.'
      transport: web (KIMI_WEB browser route)
      evidence: C:\DSH\evidence\20261007-122222-kimi-review-1858ae4-4654579.md
    - sha: cd8c2a221214d68467c040b3f6986617ca63bc3d
      range: 4654579..cd8c2a2
      verdict: SHIP
      major_findings: none
      findings_open_at_this_sha:
        - 'MINOR: the continuation join inserted a space bash does not, so a legal token split across a continuation would fail the gate fail-closed.'
        - 'NIT: a pass-3 finding wording contradicted the values it described.'
        - 'NIT: severity labels were duplicated by the list convention.'
