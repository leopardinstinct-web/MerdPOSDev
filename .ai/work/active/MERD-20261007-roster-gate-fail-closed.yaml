what_changed:
  validator: >-
    The ordering check now resolves the rsync SOURCE line and the gate INVOCATION
    line individually (line-based, ignoring comments), and a line it cannot locate
    is itself a $failures[] entry. A gate that cannot resolve its inputs now fails
    instead of passing.
  deploy_script: >-
    Comment only: records that the gate now runs after apply_0NN_*.php, so a gate
    failure no longer prevents those migrations, and that reaching the live-copy
    gate therefore requires them to be re-runnable - the documented trade-off the
    independent review asked to be made explicit.
  knowledge: >-
    .ai/playbook.md section 8.1 records the fail-open class, the line-based
    resolution rule, the requirement to prove a guard with negative controls, and
    the fact that CI is structurally blind to a fail-open guard.

