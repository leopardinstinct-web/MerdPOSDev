objective: >-
  Close the two gaps the roster packet left open: (1) the post-hoc independent
  review of the already-merged, already-deployed PR #184 diff d0a5048..a166261;
  (2) the fail-open ordering guard that review exposes - the roster gate ordering
  check silently skipped enforcement whenever it could not locate the
  timesheet_portal rsync line, so it reported success while checking nothing.

why_now: >-
  PR #184 moved the roster contract gate to run after the timesheet_portal rsync
  (fixing a two-deploy outage), but its Tier 2 review never produced a verdict:
  the only attempt, evidence/20261006-kimi-review-roster-gate-placement-54c7f6d.md,
  died on a Kimi 403 "5-hour usage limit" wall, and the packet recorded the SHA as
  unreviewed. A reviewer route now exists (the KIMI_WEB browser transport, which
  needs no escalation), so the review was completed and immediately found a real
  fail-open defect in the deployed guard.

