review:
  custody_rule: >-
    A verdict belongs only to the SHA it was returned for, and the findings listed
    in a pass are OPEN at that SHA. Dispositions ("fixed") are keyed by the SHA
    that CARRIES the fix, never written into an earlier pass's record. Two
    successive reviews rejected drafts of this block for exactly that error, so the
    structure below makes misattribution impossible rather than merely discouraged:
    passes hold verdicts and open findings; the dispositions map is keyed by SHA.
  verdict_convention: >-
    SHIP means "no blocking finding" on substance; it explicitly permits
    non-blocking minor/nit findings, which are listed as open findings for that SHA.
    It does not mean "no findings".
  passes:
    - sha: 38b7a88061ad3122c9d89523dfeb07a878bfccd5
      range: 449e89e..38b7a88
      verdict: SHIP
      major_findings: none
      findings_open_at_this_sha:
        - 'M1 (minor): the rsync leg matched its needle anywhere in a line, so a comment quoting the path could satisfy the check.'
        - 'M2 (minor): the outer deploy-script-not-found skip path still lets not-found mean fine, and the stale-script candidate lookup stays open.'
        - 'N1 (nit): ACTIVE.yaml and the packet stamps denoted instants five hours apart.'
        - 'N2 (nit): review sequencing versus this packet own Tier 3 requirement.'
        - 'N3 (nit): the deploy comment asserted re-runnable migrations without support.'
      transport: web (KIMI_WEB browser route)
      evidence: C:\DSH\evidence\20261007-121311-kimi-review-449e89e-38b7a88.md
    - sha: 1858ae4800a4b2fdcf2dd93a2a6c8d85d0a37f0f
      range: 38b7a88..1858ae4
      verdict: FIX-FIRST
      major_findings:
        - 'The pass-1 record paired a SHIP verdict for 38b7a88 with dispositions that exist only in the later delta, so the handoff would have asserted a clean SHIP for a tree whose findings were open. About the RECORD, not the code.'
      findings_open_at_this_sha:
        - 'MINOR: a line ending in an escaped backslash kept the rsync continuation window open across following comments.'
        - 'MINOR: the null fail-closed branch was not visible inside a delta-only diff (review-scope artifact, not a code defect).'
