risk: HIGH
risk_basis: >-
  A new writable surface over roster planning: it submits week data that the
  portal persists, and it reads an assignable-employee list. Under
  .ai/task-gates.md this is Tier 3-adjacent (authorization-visible write plus
  planning data), so it needs independent review on an immutable SHA and the
  product owner's merge decision, exactly like the roster deploy-gate work.

objective: >-
  Give a manager the roster planner the hand-written weekly note does today: seven
  days, an early and a late shift per day, several employees per shift, times that
  cross midnight, draft/published - stored canonically in the Beta backend via the
  gateway, readable offline, and correct in both light and dark themes.

why_now: >-
  The roster backend, permissions, endpoint and deploy gate are live and verified,
  but no UI existed: zero .twig/.js/.css files mentioned roster. The feature was
  unusable by a human. This packet closes that gap.

integration_gap_found_and_fixed:
  problem: >-
    No capability exposed the employees a store may actually be rostered with.
    store_identity returns stores; dashboard_data's workforce rows are attendance;
    the roster endpoint returned only already-assigned employees.
  fix: >-
    The portal roster endpoint gained scope=employees (see the companion packet
    MERD-20261007-roster-employees-scope on namecheap-beta-live), gated on
    roster.manage plus store access and reusing roster_employee_may_use_store() so
    the picker and the writer cannot disagree. The Drupal app asks for it only when
    the actor holds roster.manage, and degrades to "shifts queue; the portal
    validates them" when the scope is unavailable.

