  - Product-owner merge approval, then the Drupal canonical deploy.
  - Live verification on drupal-beta.merdpos.com with an authenticated session: the grid renders for a real store/week, editing obeys roster.manage, a roster.view_own actor sees only their own read-only week, the queue survives going offline and flushes on reconnect, a 16:00-00:00 late shift saves, an emptied shift survives a save, and both themes render correctly.

