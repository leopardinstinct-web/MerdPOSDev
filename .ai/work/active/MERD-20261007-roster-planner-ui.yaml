design_notes:
  surface_owned_by_controller: >-
    The grid is built in RosterController rather than ParityDataProvider because it
    is an editable grid, not the metric/group/filter shape that provider returns
    for read-only sections.
  offline_first: >-
    The week is rendered server-side, so the last confirmed week IS what the
    browser already holds when connectivity drops. Edits queue in localStorage
    under a versioned key, each submission carries its own UUID v4 idempotency id,
    and the queue flushes on `online` and on load. The browser decides what to
    retry; the portal decides what is true - an authoritative rejection drops the
    entry and says why, while anything the portal could not be asked stays queued.
  light_dark: >-
    No literal colours: every value comes from design-tokens.css, which the theme
    resolves per [data-theme], so both modes are correct from one stylesheet. The
    contract validator fails if a hex or rgb()/hsl() literal appears.
  permissions: >-
    The page requires roster.view or roster.view_own; the write requires
    roster.manage and is re-checked server-side on every queued submission. The
    nav entry is gated on the same backend permissions and, unlike Financials, does
    NOT require an active shop session - planning a week is not a shop-floor action.

