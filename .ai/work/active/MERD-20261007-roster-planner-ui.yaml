design_notes:
  surface_owned_by_controller: >-
    The grid is built in RosterController rather than ParityDataProvider because it
    is an editable grid, not the metric/group/filter shape that provider returns
    for read-only sections.
  offline_first: >-
    The week is rendered server-side, so it stays readable for as long as the tab is
    open with no fetch. Nothing is persisted separately: there is no service worker
    and no stored copy of the week, and the surface no longer claims one. Edits queue
    in localStorage under a versioned key, each submission carries its own UUID v4
    idempotency id, and the queue flushes on `online` and on load. The browser
    decides what to retry; the portal decides what is true - an authoritative
    rejection drops the entry and says why, anything the portal could not be asked
    stays queued and is retried with backoff (30s, 60s, doubling to a 10-minute cap)
    while items remain and the tab is online.
  ends_next_day_is_derived: >-
    A shift whose end is at or before its start necessarily ends the next day, and
    one whose end is after its start does not. The grid shows that as a read-only
    "+1d" indicator, the script derives the flag when it builds the payload, and the
    controller derives it again from the times. The late slot's default 16:00-00:00
    is therefore saveable with no checkbox to tick.
  cells_that_held_a_shift: >-
    The portal replaces a week wholesale, so a cell records whether the server
    rendered it with a stored shift (data-roster-original) and what its slot's
    default times are (data-roster-default-*). A cell is submitted when it has
    employees, or it held a stored shift, or its times changed; removing the last
    employee of a stored shift therefore leaves the shift in place with zero
    assignments, while a never-planned cell that was added to and emptied is not
    invented. "is-empty" no longer exists as a payload input.
  permissions: >-
    roster.view renders the whole-store grid, editable with roster.manage.
    roster.view_own is self-service and renders only the actor's own shifts for the
    week as a read-only list: it asks the portal for scope=own, never scope=store.
    The write requires roster.manage and is re-checked server-side on every queued
    submission. The nav entry is gated on the same backend permissions and, unlike
    Financials, does NOT require an active shop session - planning a week is not a
    shop-floor action.
  light_dark: >-
    No literal colours: every value comes from design-tokens.css, which the theme
    resolves per [data-theme], so both modes are correct from one stylesheet. The
    contract validator fails if a hex or rgb()/hsl() literal appears.

review_findings_fixed_from_043dc54:
  M1_default_late_shift_unsaveable: >-
    ends_next_day is derived from the times on both sides and the interactive checkbox
    became a read-only indicator; a 16:00-00:00 shift now saves with the flag true.
  M2_emptied_shift_deleted: >-
    Cells carry their origin and the slot defaults, so an emptied stored shift is still
    submitted (with zero assignments) and a never-planned cell still is not.
  m1_dead_week_cache: >-
    The cache write, its data attribute, its key and the offline-readability claim are
    gone; the honest guarantee is stated instead in the template, the script and here.
  m2_view_own_scope_confusion: >-
    roster.view gets scope=store (editable with roster.manage); roster.view_own gets
    scope=own and a read-only titled list of its own shifts.
  m3_no_retry_after_5xx: >-
    Bounded retry with backoff (30s, 60s, doubling, 10-minute cap) while items remain
    and the tab is online.
  m4_constant_uuid_fallback: >-
    The last-resort id uses Math.random, so it is never constant; a constant id would
    make every later week dedupe against the first.
  m5_note_byte_limit: >-
    The note is truncated in UTF-8 bytes client-side, so the payload the browser
    accepts is the one the controller accepts.
  m6_queue_mutation_during_flush: >-
    Settled entries are removed by re-reading storage and filtering on submission_id,
    and overlapping flushes are refused, so a save during a flush can neither be lost
    nor resurrect a dropped week.
  n1_stale_index_timestamp: "ACTIVE.yaml updated_at bumped to the packet's date."
  n2_dashboard_dependency: >-
    The roster library depends on merdpos_core/base and core/drupal/once only.

