objective: "Provide a DEV-only visual editor for fast MERDPOS Beta UI preview changes and structured change-set handoff to canonical source."
acceptance:
  - "Only an actual DEV identity can load or open UI Studio."
  - "Selecting an element never writes server source, APIs, database state, or other users' UI."
  - "Editor supports palette color changes, spacing/size/radius/font changes, visibility, and moving elements before/after/inside another element."
  - "Multiple preview edits accumulate into a readable/exportable change-set."
  - "Style/visibility edits can explicitly target This element, This component type, All matching elements, or All pages."
  - "On mobile, UI Studio keeps the underlying app visible using a compact circular quick-action control and <=46dvh editor sheet."
  - "Preview drafts can be cleared/reset and remain visibly marked PREVIEW ONLY."
  - "Canonical source remains the only production source of truth; exported edits require normal code/deploy/verify lifecycle."
