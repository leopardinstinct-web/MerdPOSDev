version: 1
id: MERD-20261001-kimi-mcp-async-jobs-v1
objective: "Eliminate ChatGPT/MCP request timeouts for long Kimi implementation turns by making Kimi execution an asynchronous submit-and-poll job while preserving single-worker safety and retained completion evidence."
packet_state: CODED_AWAITING_HOST_VERIFY
lifecycle: CODED
base_head: "d0218234d832e021f1127c19795fd9700831ba16"
last_seen_head: "d0218234d832e021f1127c19795fd9700831ba16"
root_cause:
  - "kimi_implement_task synchronously waited on subprocess.run for up to 60 minutes, but the ChatGPT/MCP client request can time out much earlier."
  - "After a client-side timeout, the local Kimi subprocess continued, making the tool call look failed even when work was still running."
  - "Bridge v0.2 retained only active/running state; once the worker ended, its exit/result details were discarded, so a detached completion could be ambiguous."
fix:
  - "kimi_implement_task now acquires the single-task guard, starts a background worker, and immediately returns accepted=true plus a task_id."
  - "bridge_status retains running/completed/failed/timed_out state, timestamps, bounded output/diagnostic and final changed paths for the most recent job."
  - "repo_checkout_feature and repo_commit_push refuse mutation while Kimi is active; repo_diff remains read-only and available."
  - "No MCP input schema or tool-count change, so the existing ChatGPT MCP app can continue without a tool rescan."
constraints:
  - "One Kimi job maximum at a time."
  - "No prompt text or secrets stored in task status."
  - "Kimi still has no Bash, push, merge or deploy authority."
  - "Internal Kimi runtime timeout remains bounded at 60-3600 seconds."
