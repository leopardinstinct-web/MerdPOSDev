objective: "Make Drupal authenticate with the authoritative MERDPOS Beta login, restore the approved MERDPOS login branding, and raise app-shell visual richness using the canonical Beta icon language. Research free Drupal modules for dashboards, widgets, charts, icons and UI building."
packet_state: VALIDATED
lifecycle: WIRED
affected_paths:
  - drupal/
acceptance:
  - Drupal login accepts the normal numeric MERDPOS User ID and Password through authoritative Beta authentication.
  - Drupal never stores the MERDPOS password and maps successful MERDPOS identity to least-privilege Drupal roles.
  - The login screen reuses approved MERDPOS brand graphics from the previous Beta login.
  - Home, Operations, Reports, Finance and DEV retain live signed data and gain the canonical icon language/richer presentation without duplicating business logic.
  - Desktop and mobile login/app routes pass rendered verification.
  - A documented shortlist evaluates free Drupal 11.4-compatible modules for dashboards, charts, icons, reusable components, filters and admin UI.
constraints:
  - MERDPOS Beta authentication/lockout remains authoritative.
  - No MERDPOS credential is logged, persisted or committed by Drupal.
  - No direct Drupal access to MERDPOS operational tables.
  - DevStudio/UI Studio remains excluded from the gateway.
  - Frozen payroll/timesheet logic remains unchanged.
next_action: Promote the validated login/rich-UI branch to beta/drupal-webapp, deploy over persistent SSH, verify anonymous login rendering and all five surfaces, then pause for the user to perform the one real MERDPOS credential login before archiving.
