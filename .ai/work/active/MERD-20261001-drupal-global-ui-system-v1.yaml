version: 1
id: MERD-20261001-drupal-global-ui-system-v1
objective: "Standardize the Drupal Beta visual component system across buttons/actions, KPI cards, dialogs/modals and light/dark theme surfaces so feature pages consume one shared primitive contract instead of competing feature-owned visual grammars."
acceptance:
  - "Buttons use one industry-standard hierarchy: primary, secondary, ghost/tertiary, danger and icon-only variants; standard desktop action height is 44px and touch target is 48px; shared padding, radius, typography, focus, hover, active and disabled states apply everywhere."
  - "KPI cards use one shared shell/sizing grammar with standard and compound variants: common surface, border, radius, padding, icon tile, label/value/meta typography and semantic tone handling; layout may vary by content but visual identity must not."
  - "Change Password and Timesheet dialogs consume one shared dialog shell for radius, spacing, close control, action placement, overlay and mobile behavior."
  - "Dark theme uses one shared surface/text/border hierarchy across Dashboard, Timesheets, Financials, Admin and dialogs; feature CSS must not create page-specific dark visual systems."
  - "No business logic, payroll, DB, authentication or authorization behavior changes."
  - "Rendered desktop and 390px mobile screenshots in light and dark must show no obvious visual drift, overflow, clipping or stranded controls before VERIFIED."
