  - "Fix-forward head 167a4cf9b24a1b9bd7b6ad11449e1bb74f52c06a promotes .merdpos-dashboard-drawer-foot button to --size-touch in the existing mobile breakpoint, moves Timesheet Shift options menu items onto --size-control desktop / --size-touch mobile geometry, and extends the global primitive validator to fail closed on both action groups."
  - "Fresh Gate 2.5 review of 167a4cf9 returned REQUEST_CHANGES with three blockers: Shop Log IN/OUT remained ~42.4px and literal-sized; account-sheet Time Sheet sync remained 36px and Change password lacked a canonical desktop minimum; Legacy Migration open/close/dynamic actions remained on undersized feature-owned geometry."
  - "Fix-forward head c5043a358066e4870c4d2430cb4947e74bd213c1 moves Shop Log IN/OUT to --size-control desktop / --size-touch mobile geometry, moves account-sheet labeled actions and Time Sheet sync to canonical 44px desktop / 48px mobile geometry, moves Legacy Sync/close/dynamic actions onto canonical desktop/mobile tokens, and extends the global primitive validator across attendance-scan.css, app-shell.css and legacy-migration-v1.css."
  - "Fresh Gate 2.5 review of c5043a35 returned REQUEST_CHANGES with one blocker: Legacy Migration still owned a competing primary/hover/danger/disabled action visual/state system despite canonical geometry."
  - "Fix-forward head 82dc6167a4249a2917d3f4d11e0f9f8b20938114 moves Legacy opener/save/preview/sync/final/close controls onto shared .merdpos-btn/.merdpos-ui-button classes and variants, removes Legacy-owned primary/danger/hover/disabled visual rules including --gradient-brand, promotes the shared icon-only mobile variant to a true --size-touch square, and hardens the validator to require shared gradient/hover/active/mobile-icon contracts plus Legacy shared-class consumption."
  - "Fresh Gate 2.5 review of immutable SHA 82dc6167a4249a2917d3f4d11e0f9f8b20938114 completed with PASS and no blocking findings. The reviewer independently checked the resulting cascade/generated Legacy markup, reran the canonical validator battery plus git diff --check, and made no edits, commits, comments/reviews, merges or deployments."
  - "Product owner explicitly approved merge; GitHub merged reviewed feature head 82dc6167a4249a2917d3f4d11e0f9f8b20938114 into beta/drupal-webapp as 82113d3e6f2b7e27b76190bf086aad6ef6258c6f. No deployment performed."
  - "First owner-approved Drupal deploy attempt fast-forwarded the server checkout from 6d46b3c to 82113d3e but correctly aborted because validate_account_password_v1.php still asserted the retired 2.4rem/.8rem close-button geometry."
  - "Validator-only PR #177 changed only drupal/tools/validate_account_password_v1.php, replacing the stale literal assertion with canonical --size-control/--radius-control desktop geometry plus --size-touch mobile promotion; local release-relevant checks and CI/global-UI/secret-scan passed."
  - "PR #177 merged into beta/drupal-webapp as fd7a8f7cb42186d8d9ee25ad863068fbe94dac11, then the established Paramiko -> server-side fast-forward -> drupal/tools/namecheap_deploy.sh path completed with exit 0."
  - "Live release marker confirms fd7a8f7cb42186d8d9ee25ad863068fbe94dac11 on beta/drupal-webapp, deployed_at 2026-10-01T00:00:02Z."
  - "Authenticated headless Opera verification captured 24 after-screenshots across Dashboard, Timesheets, Financials, Admin, account sheet and Change Password at 1440px + 390px in light/dark; all four route surfaces returned HTTP 200 in all four viewport/theme combinations with no horizontal overflow."
  - "Runtime geometry assertions passed for exercised controls: Shop Log 44/48, account menu actions 44/48, Time Sheet sync 44x44/48x48, password close 44x44/48x48, password primary action 44/48. No page errors, failed requests or HTTP 5xx responses were observed."
  - "Visual comparison against the pre-change audit found no obvious clipping, stranded controls or packing regressions; the standardized KPI/action/dialog appearance is materially more consistent across Timesheets/Financials/account/password. Dashboard dark-logo timing probe confirmed dark mark/wordmark assets at 50ms, 250ms and 1s."
