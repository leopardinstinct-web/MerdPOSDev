feature_branch: "feature/drupal-global-ui-system-v1"
audit:
  captured_live_at: "2026-10-01"
  surfaces: ["/merdpos", "/merdpos/reports", "/merdpos/finance", "/merdpos/admin", "account sheet", "Change Password"]
  findings:
    - "Live KPI heights differ materially: Dashboard ~156px, Timesheets compound ~138px, Financials ~102px."
    - "Live action controls use competing geometries: shared 44px/10px actions coexist with 44.8px/16px PDF, bare zero-radius QR action, pill shell controls and feature-specific danger sizing."
    - "Change Password uses a dedicated dialog shell instead of the shared application dialog grammar."
    - "Feature CSS still redefines KPI geometry and visual tokens after ui-primitives.css, so the nominal shared primitive layer is not actually authoritative."
    - "Dark-mode appearance is normalized by broad feature-specific selector sets; rendered logo/header appearance also differs across routes."
standard:
  buttons:
    desktop_height: "44px"
    touch_height: "48px"
    radius: "var(--radius-control)"
    hierarchy: ["primary", "secondary", "ghost", "danger", "icon-only"]
    typography: "var(--type-sm) / var(--weight-bold) for labeled actions"
  kpis:
    standard_min_height: "7rem"
    compound_min_height: "7rem"
    shell: "shared surface/border/radius/shadow/padding"
    icon: "var(--size-control) square shared icon tile"
    typography: "shared label/value/meta scale"
  dialogs:
    regular_width: "min(32rem, calc(100vw - 2rem))"
    wide_variant: "feature-owned only when content requires it"
    shell: "shared backdrop/header/body/footer/close/action geometry"
constraints:
  - "Preserve the binding five-color runtime palette and separate operational semantic colors."
  - "Preserve frozen payroll/timesheet logic and all existing authorization gates."
  - "Do not add a new corrective CSS layer; strengthen the canonical primitive owner and remove/simplify feature overrides."
  - "Keep feature CSS responsible for layout/composition only where practical."
  - "Use Kimi K3-256K Low for bounded implementation; ChatGPT independently reviews the exact diff and runtime."
