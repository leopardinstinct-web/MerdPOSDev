standard:
  buttons:
    desktop_height: "44px"
    touch_height: "48px"
    radius: "var(--radius-control)"
    hierarchy: ["primary", "secondary", "ghost", "danger", "icon-only"]
  kpis:
    standard_min_height: "7rem"
    compound_min_height: "7rem"
    shell: "shared surface/border/radius/shadow/padding"
    icon: "var(--size-control) square shared icon tile"
    typography: "shared label/value/meta scale"
  dialogs:
    regular_width: "min(32rem, calc(100vw - 2rem))"
    wide_variant: "content-driven only"
    max_height: "90dvh"
    shell: "shared backdrop/header/body/footer/close/action geometry"
