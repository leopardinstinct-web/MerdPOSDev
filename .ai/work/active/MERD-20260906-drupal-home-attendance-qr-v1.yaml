id: MERD-20260906-drupal-home-attendance-qr-v1
branch: milestone/drupal-home-attendance-qr-v1
base_head: d2229510c62334952a873a1d0c4001087720bc2f
objective: Add a permission-scoped Home widget that lets an authenticated MERDPOS user scan the current POS QR and record attendance through the existing authoritative attendance service.
packet_state: CODED
lifecycle: CODED
scope:
  - Render the scanner only when authoritative MERDPOS permission attendance.scan is present.
  - Use the device rear camera and browser QR detection when supported.
  - Provide a QR link/token paste fallback when live scanning is unavailable.
  - Submit scans to a Drupal POST endpoint protected by Drupal CSRF.
  - Forward only the extracted signed QR token through PortalGatewayClient to attendance_scan.
  - Reuse all existing store-assignment, duplicate, cooldown, cross-store suspension, IN/OUT and audit/outbox behavior.
  - Never write attendance operational tables directly from Drupal.
acceptance:
  - Attendance widget source validator, JS syntax, YAML and existing five-surface validators pass.
  - PHP 8.4 deployment validates Drupal routing/container/Twig and existing regressions.
  - Namecheap release probe reports attendance_qr_v1 status OK and confirms the signed attendance route rejects a deliberately invalid token without mutation.
  - Authenticated Home displays the scanner for the current DEV actor and remains responsive in Light/Dark desktop/mobile.
  - Browser camera capability/fallback state is exercised without submitting a real attendance QR.
  - A real attendance mutation is not fabricated for verification; operational behavior remains delegated to the already-authoritative attendance_scan API.
remaining:
  - Validate on PHP 8.4 runtime, deploy, browser-regress and archive.
