id: MERD-20260829-ui-studio
objective: "Provide a DEV-only visual editor for fast MERDPOS Beta UI preview changes and structured change-set handoff to canonical source."
acceptance:
  - "Only an actual DEV identity can load or open UI Studio."
  - "Selecting an element never writes server source, APIs, database state, or other users' UI."
  - "The rendered MERDPOS app remains visible; UI Studio has no persistent inspector/change-set panel on desktop or mobile."
  - "One draggable UI hub opens a dark single-ring drill-down radial menu on desktop and mobile; entering a submenu replaces the current ring and the hub becomes contextual Back."
  - "Hub and active sector ring share one physical stage/center on touch devices and during visual-viewport changes."
  - "Sector labels/icons remain readable, labels stay within the slice, and sector bands provide practical phone touch targets."
  - "Color exposes BG/Text targeting plus the five MERDPOS master colors first, with More opening the extended rotating palette."
  - "Numeric Padding/Margin/Gap/Radius/Font use a two-sector increase/decrease stepper with the current value in the hub; Width retains direct presets."
  - "Layout, Scope, Move and Changes use the same single-ring drill-down model; Copy and Chat handoff remain available from the circle."
  - "DEV can record element comments, add preview elements, select navigation/transient menu elements, and open navigable local history."
  - "Interacting with Studio must not collapse an already-expanded desktop MERDPOS navigation rail."
