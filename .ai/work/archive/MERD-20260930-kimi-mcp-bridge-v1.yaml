known_lessons:
  - "An MCP client timeout does not prove the local Kimi subprocess stopped. Check bridge_status first; do not retry while kimi_task.active=true."
  - "One Kimi implementation task is allowed at a time; concurrent calls are rejected to prevent duplicate workers editing the same worktree."
  - "Use K3-256K Low for bounded implementation after ChatGPT has already scoped/reviewed the task; reserve higher effort for actual unresolved implementation ambiguity."
