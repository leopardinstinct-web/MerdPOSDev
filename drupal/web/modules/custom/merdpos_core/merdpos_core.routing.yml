merdpos_core.dashboard:
  path: '/merdpos'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\DashboardController::dashboard'
    _title: 'MERDPOS'
  requirements:
    _permission: 'view merdpos management dashboard'

merdpos_core.dashboard_layout:
  path: '/merdpos/dashboard/layout'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\DashboardController::dashboardLayout'
  requirements:
    _permission: 'access merdpos portal'
  methods: [POST]

merdpos_core.attendance_scan:
  path: '/merdpos/attendance/scan'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\DashboardController::attendanceScan'
  requirements:
    _permission: 'access merdpos portal'
  methods: [POST]

merdpos_core.operations:
  path: '/merdpos/operations'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\OperationsController::operations'
    _title: 'Operations'
  requirements:
    _permission: 'access merdpos portal'

merdpos_core.disputes:
  path: '/merdpos/disputes'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\DisputesController::disputes'
    _title: 'Disputes'
  requirements:
    _permission: 'access merdpos portal'
  methods: [GET, POST]


merdpos_core.administration:
  path: '/merdpos/admin'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\AdministrationController::administration'
    _title: 'Administration'
  requirements:
    _permission: 'manage merdpos operations'

merdpos_core.legacy_migration:
  path: '/merdpos/admin/legacy-migration'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\AdministrationController::legacyMigration'
  requirements:
    _permission: 'manage merdpos operations'
  methods: [GET, POST]

merdpos_core.reports:
  path: '/merdpos/reports'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\ReportsController::reports'
    _title: 'Reports'
  requirements:
    _permission: 'access merdpos portal'

merdpos_core.reports_export:
  path: '/merdpos/reports/export.csv'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\ReportsController::exportCsv'
  requirements:
    _permission: 'access merdpos portal'

merdpos_core.finance:
  path: '/merdpos/finance'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\FinanceController::finance'
    _title: 'Financials'
  requirements:
    _permission: 'access merdpos portal'

merdpos_core.finance_submit:
  path: '/merdpos/finance/submit'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\FinanceController::submitJson'
  requirements:
    _permission: 'access merdpos portal'
  methods: [POST]

merdpos_core.change_password:
  path: '/merdpos/account/change-password'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\AccountController::changePassword'
  requirements:
    _permission: 'access merdpos portal'
  methods: [POST]

merdpos_core.working_client:
  path: '/merdpos/account/working-client'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\AccountController::selectWorkingClient'
  requirements:
    _permission: 'access merdpos portal'
  methods: [POST]

merdpos_core.timesheet_google_sync:
  path: '/merdpos/account/timesheet-google-sync'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\AccountController::syncGoogleTimeSheet'
  requirements:
    _permission: 'access merdpos portal'
  methods: [POST]

merdpos_core.dev:
  path: '/merdpos/dev'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\DevController::dev'
    _title: 'DEV'
  requirements:
    _permission: 'access merdpos dev tools'
