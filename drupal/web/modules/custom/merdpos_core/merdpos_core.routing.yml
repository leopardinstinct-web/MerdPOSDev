merdpos_core.dashboard:
  path: '/merdpos'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\DashboardController::dashboard'
    _title: 'MERDPOS'
  requirements:
    _permission: 'view merdpos management dashboard'

merdpos_core.operations:
  path: '/merdpos/operations'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\OperationsController::operations'
    _title: 'Operations'
  requirements:
    _permission: 'access merdpos portal'


merdpos_core.administration:
  path: '/merdpos/admin'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\AdministrationController::administration'
    _title: 'Administration'
  requirements:
    _permission: 'manage merdpos operations'

merdpos_core.reports:
  path: '/merdpos/reports'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\ReportsController::reports'
    _title: 'Reports'
  requirements:
    _permission: 'access merdpos portal'

merdpos_core.reports_export:
  path: '/merdpos/reports/export.csv'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\ReportsController::exportCsv'
  requirements:
    _permission: 'access merdpos portal'

merdpos_core.finance:
  path: '/merdpos/finance'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\FinanceController::finance'
    _title: 'Finance'
  requirements:
    _permission: 'manage merdpos operations'

merdpos_core.dev:
  path: '/merdpos/dev'
  defaults:
    _controller: 'Drupal\merdpos_core\Controller\DevController::dev'
    _title: 'DEV'
  requirements:
    _permission: 'access merdpos dev tools'
