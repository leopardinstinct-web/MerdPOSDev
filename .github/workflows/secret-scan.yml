name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_history:
        description: Scan the full Git history
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (redacted)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select commit range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          FULL_HISTORY: ${{ inputs.full_history }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FULL_HISTORY" == "true" ]]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "value=${PR_BASE_SHA}..${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "value=${BEFORE_SHA}..${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${CURRENT_SHA}^..${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan without printing secret values
        shell: bash
        env:
          COMMIT_RANGE: ${{ steps.range.outputs.value }}
        run: |
          set -euo pipefail
          args=(git --redact --no-banner --exit-code 1)
          if [[ -n "$COMMIT_RANGE" ]]; then
            args+=(--log-opts="$COMMIT_RANGE")
          fi
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            "${args[@]}" .
