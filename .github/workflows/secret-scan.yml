name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
      - namecheap-beta-live
  workflow_dispatch:
    inputs:
      full_history:
        description: Scan the full Git history
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  # Safe for PRs because every replacement scan covers base..latest head. Do not
  # cancel branch-push scans: the next incremental BEFORE..CURRENT range would
  # otherwise omit a cancelled commit from history coverage.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks (redacted)
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete source history
        uses: actions/checkout@v4
        with:
          # Commit-range secret scanning is one of the few checks that genuinely
          # needs complete ancestry. A shallow PR merge can contain the base
          # commit while omitting older commits from the PR's second-parent
          # history, which would make base..HEAD silently incomplete.
          fetch-depth: 0
          fetch-tags: false

      - name: Select commit range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          FULL_HISTORY: ${{ inputs.full_history }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FULL_HISTORY" == "true" ]]; then
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "mode=full-history" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi

          # fetch-depth: 0 supplies complete reachable history. The exact-object
          # fallback covers unusual force-push/event cases where the event's base
          # is no longer reachable from a fetched ref.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base"
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::error::Could not resolve secret-scan base commit $base"
            exit 1
          fi

          echo "value=${base}..${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
          echo "mode=incremental" >> "$GITHUB_OUTPUT"

      - name: Scan without printing secret values
        shell: bash
        env:
          COMMIT_RANGE: ${{ steps.range.outputs.value }}
        run: |
          set -euo pipefail
          args=(git --redact --no-banner --exit-code 1)
          if [[ -n "$COMMIT_RANGE" ]]; then
            args+=(--log-opts="$COMMIT_RANGE")
          fi
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            "${args[@]}" .
