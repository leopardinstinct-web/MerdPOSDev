name: Restore Android Gradle wrapper

on:
  workflow_dispatch:
  push:
    branches:
      - milestone-1-trusted-baseline-ci
    paths:
      - '.github/workflows/restore-gradle-wrapper.yml'

permissions:
  contents: read

jobs:
  generate-wrapper:
    name: Generate from clean Flutter 3.44.2 project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter 3.44.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: false

      - name: Generate clean disposable project
        shell: bash
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          flutter create --platforms=android --empty "$work_dir/clean_wrapper_source"

          expected_url="$(sed -n 's/^distributionUrl=//p' merdpos_staff/android/gradle/wrapper/gradle-wrapper.properties)"
          generated_url="$(sed -n 's/^distributionUrl=//p' "$work_dir/clean_wrapper_source/android/gradle/wrapper/gradle-wrapper.properties")"
          if [[ "$generated_url" != "$expected_url" ]]; then
            echo "Generated wrapper distribution does not match the repository property."
            echo "Expected: $expected_url"
            echo "Generated: $generated_url"
            exit 1
          fi

          mkdir -p wrapper-artifact/merdpos_staff/android/gradle/wrapper
          install -m 0755 "$work_dir/clean_wrapper_source/android/gradlew" wrapper-artifact/merdpos_staff/android/gradlew
          install -m 0644 "$work_dir/clean_wrapper_source/android/gradlew.bat" wrapper-artifact/merdpos_staff/android/gradlew.bat
          install -m 0644 "$work_dir/clean_wrapper_source/android/gradle/wrapper/gradle-wrapper.jar" wrapper-artifact/merdpos_staff/android/gradle/wrapper/gradle-wrapper.jar
          sha256sum wrapper-artifact/merdpos_staff/android/gradle/wrapper/gradle-wrapper.jar \
            > wrapper-artifact/gradle-wrapper.jar.sha256
          printf '%s\n' "$expected_url" > wrapper-artifact/gradle-distribution-url.txt

      - name: Verify artifact contains only approved wrapper files and metadata
        shell: bash
        run: |
          set -euo pipefail
          actual="$(find wrapper-artifact -type f -printf '%P\n' | sort)"
          expected="$(printf '%s\n' \
            gradle-distribution-url.txt \
            gradle-wrapper.jar.sha256 \
            merdpos_staff/android/gradle/wrapper/gradle-wrapper.jar \
            merdpos_staff/android/gradlew \
            merdpos_staff/android/gradlew.bat | sort)"
          [[ "$actual" == "$expected" ]]

      - name: Upload reviewed wrapper artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-3.44.2-gradle-wrapper
          path: wrapper-artifact/
          if-no-files-found: error
          retention-days: 1
