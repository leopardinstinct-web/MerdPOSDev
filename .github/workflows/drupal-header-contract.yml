name: Drupal header contract

on:
  pull_request:
    branches:
      - beta/drupal-webapp
    paths:
      - 'drupal/**'
      - '.github/workflows/drupal-header-contract.yml'
  push:
    branches:
      - beta/drupal-webapp
    paths:
      - 'drupal/**'
      - '.github/workflows/drupal-header-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-page-header:
    name: Global page-header contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Validate global page headers
        run: php drupal/tools/validate_global_page_headers_v1.php
