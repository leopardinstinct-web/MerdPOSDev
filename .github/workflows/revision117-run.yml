name: Run DevStudio revision 117 transform

on:
  push:
    branches:
      - namecheap-beta-live

permissions:
  contents: write

jobs:
  transform:
    if: contains(github.event.head_commit.message, '[stage-rev117]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical Beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Transform canonical source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_revision117.py
          python3 scripts/fix_revision117_contract.py
          curl -fsSL 'https://app.merdpos.com/beta/timesheet_portal/studio_context_asset.php?t=d68bc1e925f29be6120c422f6f19bf730a9788e728ce2e17ecc6ce4a12ec71a6' \
            -o namecheap_beta_live/timesheet_portal/assets/brand/M_Icon_v2.svg
          echo 'fd98914e2dcb700477e04b0ed4ddece75ecebf304a632e775149b57b3f1d9177  namecheap_beta_live/timesheet_portal/assets/brand/M_Icon_v2.svg' | sha256sum -c -
          php -l namecheap_beta_live/timesheet_portal/includes/ui_studio_history.php
          node --check namecheap_beta_live/timesheet_portal/assets/ui-studio.js
          node --check namecheap_beta_live/timesheet_portal/assets/account-menu.js
          node --check namecheap_beta_live/browser_tests/revision117-runtime.spec.js
          bash -n scripts/deploy_namecheap_beta.sh
          php namecheap_beta_live/backend/cli/validate_beta_runtime_contract.php

      - name: Commit revision 117 product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement DevStudio revision 117 [rev117-applied]'
          git push origin HEAD:namecheap-beta-live
