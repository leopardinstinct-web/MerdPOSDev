name: Retry DevStudio revision 130 transform

on:
  push:
    branches:
      - namecheap-beta-live

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[retry-rev130]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair transformer typo and preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ast
          p=Path('scripts/apply_revision130.py')
          t=p.read_text(encoding='utf-8')
          old='t=replace_once(t,"  function openMobileTools(trigger) {","  function openMobileTools(trigger, options = {}) {")'
          new='t=replace_once(t,"  function openMobileTools(trigger) {","  function openMobileTools(trigger, options = {}) {",\'account open signature\')'
          if t.count(old)!=1: raise SystemExit(f'expected one transformer typo, found {t.count(old)}')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          tree=ast.parse(t)
          bad=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Call) and isinstance(node.func,ast.Name) and node.func.id=='replace_once' and len(node.args)<4:
                  bad.append(node.lineno)
          if bad: raise SystemExit(f'replace_once calls missing labels at {bad}')
          PY
      - name: Apply canonical revision 130
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_revision130.py
      - name: Syntax and runtime contract
        shell: bash
        run: |
          set -euo pipefail
          php -l namecheap_beta_live/timesheet_portal/dashboard.php
          php -l namecheap_beta_live/timesheet_portal/api/admin_directory.php
          php -l namecheap_beta_live/backend/cli/validate_beta_runtime_contract.php
          node --check namecheap_beta_live/timesheet_portal/assets/dashboard-builder.js
          node --check namecheap_beta_live/timesheet_portal/assets/directory.js
          node --check namecheap_beta_live/timesheet_portal/assets/timings.js
          node --check namecheap_beta_live/timesheet_portal/assets/account-menu.js
          node --check namecheap_beta_live/browser_tests/revision130-runtime.spec.js
          php namecheap_beta_live/backend/cli/validate_beta_runtime_contract.php
          git diff --check
      - name: Targeted Chromium regression
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright test namecheap_beta_live/browser_tests/revision130-runtime.spec.js namecheap_beta_live/browser_tests/implementation-patches-runtime.spec.js --workers=1 --reporter=line
      - name: Commit canonical product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement DevStudio revision 130 [rev130-applied]'
          git push origin HEAD:namecheap-beta-live
