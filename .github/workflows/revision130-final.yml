name: Run final DevStudio revision 130 release transform

on:
  push:
    branches:
      - namecheap-beta-live

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[final-rev130]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply revision 130
        run: |
          set -euo pipefail
          python3 scripts/revision130_release_helper.py pre
          python3 scripts/apply_revision130.py
          python3 scripts/revision130_release_helper.py post
          python3 - <<'PY'
          from pathlib import Path
          p=Path('namecheap_beta_live/browser_tests/revision130-runtime.spec.js')
          t=p.read_text(encoding='utf-8')
          old="expect(timings).not.toContain('<span>Closed</span>');"
          new="expect(timings).not.toContain('<span>Closed</span></label>');"
          if t.count(old)!=1: raise SystemExit(f'expected one row Closed assertion, found {t.count(old)}')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate source contracts
        run: |
          set -euo pipefail
          php -l namecheap_beta_live/timesheet_portal/dashboard.php
          php -l namecheap_beta_live/timesheet_portal/api/admin_directory.php
          php -l namecheap_beta_live/backend/cli/validate_beta_runtime_contract.php
          node --check namecheap_beta_live/timesheet_portal/assets/dashboard-builder.js
          node --check namecheap_beta_live/timesheet_portal/assets/directory.js
          node --check namecheap_beta_live/timesheet_portal/assets/timings.js
          node --check namecheap_beta_live/timesheet_portal/assets/account-menu.js
          node --check namecheap_beta_live/browser_tests/revision130-runtime.spec.js
          bash -n scripts/deploy_namecheap_beta.sh
          php namecheap_beta_live/backend/cli/validate_beta_runtime_contract.php
          git diff --check
      - name: Run targeted Chromium regressions
        run: |
          set -euo pipefail
          google-chrome --version
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright test namecheap_beta_live/browser_tests/revision130-runtime.spec.js namecheap_beta_live/browser_tests/implementation-patches-runtime.spec.js --workers=1 --reporter=line
      - name: Commit product source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement DevStudio revision 130 [rev130-applied]'
          git push origin HEAD:namecheap-beta-live
