name: Complete revision 117 About artwork

on:
  push:
    branches:
      - namecheap-beta-live

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[fix-rev117-about-v2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact v2 artwork to About dialog
        shell: bash
        run: |
          set -euo pipefail
          file='namecheap_beta_live/timesheet_portal/dashboard.php'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('namecheap_beta_live/timesheet_portal/dashboard.php')
          t=p.read_text(encoding='utf-8-sig')
          old='assets/brand/M_Icon.svg?v=20260828about1'
          new='assets/brand/M_Icon_v2.svg?v=20260902ds117'
          if t.count(old) != 1:
              raise SystemExit(f'expected one old About dialog icon, found {t.count(old)}')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          grep -q 'assets/brand/M_Icon_v2.svg?v=20260902ds117' "$file"
          php -l "$file"
          git diff --check
      - name: Commit product completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add namecheap_beta_live/timesheet_portal/dashboard.php
          git commit -m 'Use supplied v2 artwork in About dialog'
          git push origin HEAD:namecheap-beta-live
