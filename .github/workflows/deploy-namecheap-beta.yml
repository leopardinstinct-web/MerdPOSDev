name: Deploy Namecheap Beta

on:
  push:
    branches:
      - namecheap-beta-live
    paths:
      - 'namecheap_beta_live/**'
      - '.github/workflows/deploy-namecheap-beta.yml'
  workflow_dispatch:

concurrency:
  group: namecheap-beta-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          SSH_HOST: ${{ secrets.NAMECHEAP_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$SSH_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/namecheap_beta
          chmod 600 ~/.ssh/namecheap_beta
          ssh-keyscan -p 21098 "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend source
        env:
          SSH_HOST: ${{ secrets.NAMECHEAP_HOST }}
          SSH_USER: ${{ secrets.NAMECHEAP_USER }}
        run: |
          set -euo pipefail
          rsync -az \
            --exclude='config.php' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.deployed_version' \
            --exclude='imports/' \
            --exclude='*.csv' \
            --exclude='*.log' \
            -e "ssh -p 21098 -i ~/.ssh/namecheap_beta -o IdentitiesOnly=yes" \
            namecheap_beta_live/backend/ \
            "$SSH_USER@$SSH_HOST:~/merdpos.com/app/beta/backend/"

      - name: Deploy MERDPOS portal
        env:
          SSH_HOST: ${{ secrets.NAMECHEAP_HOST }}
          SSH_USER: ${{ secrets.NAMECHEAP_USER }}
        run: |
          set -euo pipefail
          rsync -az \
            --exclude='config.php' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.deployed_version' \
            --exclude='*.log' \
            -e "ssh -p 21098 -i ~/.ssh/namecheap_beta -o IdentitiesOnly=yes" \
            namecheap_beta_live/timesheet_portal/ \
            "$SSH_USER@$SSH_HOST:~/merdpos.com/app/beta/timesheet_portal/"

      - name: Apply idempotent management role migration
        env:
          SSH_HOST: ${{ secrets.NAMECHEAP_HOST }}
          SSH_USER: ${{ secrets.NAMECHEAP_USER }}
        run: |
          set -euo pipefail
          ssh -p 21098 -i ~/.ssh/namecheap_beta -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            'php ~/merdpos.com/app/beta/backend/cli/apply_022_management_roles.php'

      - name: Verify deployed portal responds
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            https://app.merdpos.com/beta/timesheet_portal/ >/dev/null
          echo 'Namecheap beta deployment completed.'
