name: Repair revision 117 transformer

on:
  push:
    branches:
      - namecheap-beta-live

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-rev117-workflow]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct canonical-source match and retry
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/revision117-apply.yml')
          text=p.read_text(encoding='utf-8')
          old="text = replace_once(text, '<h2 class=\"ui-page-title\">Employees</h2>', '<h2 class=\"ui-page-title\">Workforce</h2>', 'Workforce heading')"
          new="text = replace_once(text, '<div><h2>Employees</h2></div>', '<div><h2 class=\"ui-page-title\">Workforce</h2></div>', 'Workforce heading')"
          if text.count(old) != 1:
              raise SystemExit(f'Workforce transformer match drifted: {text.count(old)}')
          text=text.replace(old,new,1)
          old_css='.merd-shell .directory-card > .directory-toolbar > :is(.merd-action-cluster,.dev-store-actions,.directory-toolbar-actions) {'
          new_css='.merd-shell .directory-card > .directory-toolbar > :is(.directory-actions,.merd-action-cluster,.dev-store-actions,.directory-toolbar-actions) {'
          if old_css in text:
              text=text.replace(old_css,new_css,1)
          p.write_text(text,encoding='utf-8')
          Path('.github/workflows/revision117-repair.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Retry corrected DevStudio revision 117 [stage-rev117]'
          git push origin HEAD:namecheap-beta-live
