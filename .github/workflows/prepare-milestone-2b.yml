name: Prepare Milestone 2B Flutter changes

on:
  workflow_dispatch:
  push:
    branches:
      - milestone-2b-secure-token-storage

permissions:
  contents: write

concurrency:
  group: prepare-milestone-2b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter 3.44.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: merdpos_staff
        run: flutter pub get

      - name: Format changed Dart files
        working-directory: merdpos_staff
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/main)"
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- lib test
          )
          dart_files=()
          for file in "${changed_files[@]}"; do
            if [[ "$file" == *.dart ]]; then
              dart_files+=("$file")
            fi
          done
          if (( ${#dart_files[@]} > 0 )); then
            dart format "${dart_files[@]}"
          fi

      - name: Commit generated lockfile and formatting
        shell: bash
        run: |
          set -euo pipefail
          git add merdpos_staff/pubspec.lock merdpos_staff/lib merdpos_staff/test
          if git diff --cached --quiet; then
            echo "Generated files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format and resolve Milestone 2B Flutter changes"
          git push
