name: Clean revision 130 runner artifacts

on:
  push:
    branches:
      - namecheap-beta-live

permissions:
  contents: write

jobs:
  clean:
    if: contains(github.event.head_commit.message, '[cleanup-rev130-node]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove accidental runner dependencies
        run: |
          set -euo pipefail
          rm -rf node_modules
          git diff --check
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A node_modules
          git commit -m 'Remove accidental revision 130 runner dependencies'
          git push origin HEAD:namecheap-beta-live
