name: Beta guardrails

on:
  push:
    branches:
      - namecheap-beta-live
    paths:
      - 'namecheap_beta_live/**'
      - 'scripts/**'
      - '.ai/**'
      - 'AGENTS.md'
      - '.github/workflows/**'
  pull_request:
    branches:
      - namecheap-beta-live
    paths:
      - 'namecheap_beta_live/**'
      - 'scripts/**'
      - '.ai/**'
      - 'AGENTS.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-guardrails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta-source-contract:
    name: Beta source contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint beta PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -n -l "$file"
          done < <(find namecheap_beta_live/backend namecheap_beta_live/timesheet_portal -type f -name '*.php' -print0)

      - name: Validate dashboard write audit atomicity
        run: php namecheap_beta_live/backend/cli/validate_dashboard_write_audit.php

      - name: Validate atomic Store write
        run: php namecheap_beta_live/backend/cli/validate_atomic_store_write.php

      - name: Validate beta runtime contract
        run: php namecheap_beta_live/backend/cli/validate_beta_runtime_contract.php

      - name: Validate AI continuity truthfulness
        run: php namecheap_beta_live/backend/cli/validate_ai_continuity.php

      - name: Validate portal permission policy
        run: php namecheap_beta_live/backend/cli/validate_portal_permission_policy.php

      - name: Validate portal loader order
        run: php namecheap_beta_live/backend/cli/validate_portal_loader_order.php

      - name: Validate shared beta state scope
        run: php namecheap_beta_live/backend/cli/validate_beta_state_scope.php

      - name: Validate Drupal Working Now service contract
        run: php namecheap_beta_live/backend/cli/validate_drupal_working_now_service.php

      - name: Validate roster planning contract
        run: php namecheap_beta_live/backend/cli/validate_roster_planning_v1.php

      # The live tree on Namecheap holds only backend/ and timesheet_portal/ - no
      # repository prefix and no top-level scripts/. A validator that assumes the
      # repository shape passes CI and then aborts every canonical deploy, so this
      # runs it against a replica of the deployed layout as well.
      - name: Validate roster contract against the deployed-tree layout
        shell: bash
        run: |
          set -euo pipefail
          replica="$(mktemp -d)"
          cp -R namecheap_beta_live/backend "$replica/backend"
          cp -R namecheap_beta_live/timesheet_portal "$replica/timesheet_portal"
          test "$(ls -1 "$replica" | sort | tr '\n' ' ')" = "backend timesheet_portal "
          php "$replica/backend/cli/validate_roster_planning_v1.php"
          rm -rf "$replica"

      - name: Validate Namecheap deploy recovery guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy_namecheap_beta.sh
          grep -q 'validate_portal_loader_order.php' scripts/deploy_namecheap_beta.sh
          grep -q 'validate_beta_state_scope.php' scripts/deploy_namecheap_beta.sh
          grep -q 'validate_drupal_working_now_service.php' scripts/deploy_namecheap_beta.sh
          grep -q 'backend/api/integrations/working_now.php' scripts/deploy_namecheap_beta.sh

      - name: Syntax-check portal JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find namecheap_beta_live/timesheet_portal/assets namecheap_beta_live/browser_tests -type f -name '*.js' -print0)

      - name: Reject forbidden tracked beta secrets/build artifacts
        shell: bash
        run: |
          set -euo pipefail
          violations="$({
            git ls-files 'namecheap_beta_live/**/config.php' || true
            git ls-files 'namecheap_beta_live/**/.env' 'namecheap_beta_live/**/.env.*' || true
            git ls-files 'namecheap_beta_live/**/.deployed_version' || true
            git ls-files 'namecheap_beta_live/**/*.apk' || true
          } | sort -u)"
          if [[ -n "$violations" ]]; then
            echo "Forbidden tracked beta paths detected:"
            printf '%s\n' "$violations"
            exit 1
          fi

      - name: Confirm system Chrome
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version

      - name: Install pinned Playwright test runner
        shell: bash
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Run beta browser regressions
        shell: bash
        run: npx playwright test namecheap_beta_live/browser_tests --workers=1 --reporter=line
