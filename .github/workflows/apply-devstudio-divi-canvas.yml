          new="  function close(){if(!panel)return;state.open=false;state.openActionsKey='';state.canvasInteraction=false;panel.hidden=true;chooser.hidden=true;hideModulePicker();if(canvasLayer){canvasLayer.hidden=true;canvasLayer.innerHTML='';}document.body.classList.remove('merd-ui-structure-open');clearDropHints();}"
          assert old in js
          js=js.replace(old,new,1)
