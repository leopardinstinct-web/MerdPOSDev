          new="  function openChooser(target,position){\n    const types=typesForPlacement(target,position);if(!types.length)return;\n    if(types.length===1){const type=types[0];studio()?.addElement?.(target.el,type,position,TYPE_DEFAULTS[type]||TYPE_LABELS[type]);state.openActionsKey='';refresh(true);return;}"
