          old="    const selected=findNodeByKey(state.selectedKey);breadcrumb.textContent=selected?pathFor(selected):`Page / ${state.tree.label}`;\n  }"
          new="    const selected=findNodeByKey(state.selectedKey);breadcrumb.textContent=selected?pathFor(selected):`Page / ${state.tree.label}`;renderCanvas();\n  }"
          assert old in js
          js=js.replace(old,new,1)
