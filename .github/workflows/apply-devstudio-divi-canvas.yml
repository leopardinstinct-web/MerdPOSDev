d-ui-structure-module-grid button{display:flex;align-items:center;gap:9px;min-height:54px;border:1px solid #dbe3ee;border-radius:10px;background:#fff;color:#334155;text-align:left;padding:9px 10px;cursor:pointer}.merd-ui-structure-module-grid button:hover{border-color:var(--color-brand-cyan,#12BDF3);box-shadow:0 4px 14px rgba(15,23,42,.08)}.merd-ui-structure-module-grid button[hidden]{display:none!important}.merd-ui-structure-module-grid button span{display:grid;place-items:center;flex:0 0 28px;width:28px;height:28px;border-radius:8px;background:#eef6ff;color:var(--color-brand-navy,#031B4B);font-weight:850}.merd-ui-structure-module-grid button strong{font-size:.72rem}
