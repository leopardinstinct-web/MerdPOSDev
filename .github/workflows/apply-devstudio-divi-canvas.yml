.merd-ui-structure-canvas-insert{position:fixed;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:5px;min-height:30px;border:1px solid rgba(255,255,255,.85);border-radius:999px;padding:4px 10px;background:var(--color-brand-navy,#031B4B);color:#fff;box-shadow:0 6px 18px rgba(2,6,23,.24);pointer-events:auto;font-size:.64rem;font-weight:800;cursor:pointer;white-space:nowrap}.merd-ui-structure-canvas-insert span{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--color-brand-navy,#031B4B);font-size:.9rem;line-height:1}.merd-ui-structure-canvas-insert.is-section{background:var(--color-brand-cyan,#12BDF3);color:#03233f}.merd-ui-structure-canvas-insert.is-section span{color:#075985}.merd-ui-structure-canvas-insert.is-container{background:var(--color-brand-violet,#8B2EFF)}.merd-ui-structure-canvas-insert.is-component{background:var(--merd-ui-accent,#F59E0B);color:var(--merd-ui-accent-ink,#111827)}.merd-ui-structure-canvas-insert:hover{filter:brightness(1.06);transform:translate(-50%,-50%) scale(1.03)}
