.merd-ui-structure-canvas-outline{position:fixed;box-sizing:border-box;border:1px dashed color-mix(in srgb,var(--color-brand-cyan,#12BDF3) 68%,transparent);border-radius:10px;pointer-events:none}.merd-ui-structure-canvas-outline.is-container{border-color:color-mix(in srgb,var(--color-brand-violet,#8B2EFF) 62%,transparent);border-radius:8px}.merd-ui-structure-canvas-outline.is-selected{border-style:solid;border-width:2px;box-shadow:0 0 0 1px rgba(255,255,255,.46) inset}.merd-ui-structure-canvas-outline>span{position:absolute;right:5px;top:5px;padding:2px 6px;border-radius:999px;background:rgba(3,27,75,.86);color:#fff;font-size:.58rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 4px 12px rgba(2,6,23,.18)}
