name: Apply DevStudio Divi canvas UX

on:
  push:
    branches:
      - namecheap-beta-live
    paths:
      - .github/workflows/apply-devstudio-divi-canvas.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: namecheap-beta-live
          fetch-depth: 0

      - name: Apply canvas-first Structure UX
        run: python3 .github/scripts/apply-devstudio-divi-canvas.py

      - name: Validate transformed source
        shell: bash
        run: |
          set -euo pipefail
          node --check namecheap_beta_live/timesheet_portal/assets/ui-studio-structure.js
          node --check namecheap_beta_live/browser_tests/ui-studio-structure-runtime.spec.js
          php namecheap_beta_live/backend/cli/validate_beta_runtime_contract.php
          bash -n scripts/deploy_namecheap_beta.sh
          git diff --check

      - name: Run targeted Structure browser regressions
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright test namecheap_beta_live/browser_tests/ui-studio-structure-runtime.spec.js --workers=1 --reporter=line

      - name: Commit canonical implementation and self-remove apply helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-devstudio-divi-canvas.yml .github/scripts/apply-devstudio-divi-canvas.py
          git add namecheap_beta_live/timesheet_portal/assets/ui-studio-structure.js \
                  namecheap_beta_live/timesheet_portal/assets/ui-studio-structure.css \
                  namecheap_beta_live/timesheet_portal/assets/management.js \
                  namecheap_beta_live/browser_tests/ui-studio-structure-runtime.spec.js \
                  namecheap_beta_live/backend/cli/validate_beta_runtime_contract.php \
                  namecheap_beta_live/timesheet_portal/UI_STUDIO.md \
                  scripts/deploy_namecheap_beta.sh \
                  .ai/playbook.md \
                  .ai/evidence/devstudio-divi-canvas-study-20260903.md
          git commit -m 'Implement canvas-first DevStudio structure editing [devstudio-canvas]'
          git push origin HEAD:namecheap-beta-live

# retry after hygiene fix
